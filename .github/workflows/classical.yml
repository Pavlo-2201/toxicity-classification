name: classical

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: classical
    steps:
      - uses: actions/checkout@v6
      - name: Line endings are LF in the index (hashes depend on bytes)
        shell: bash
        run: |
          if git ls-files --eol -- :/ | grep -E "^i/(crlf|mixed)"; then echo "CRLF in index"; exit 1; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Clean install
        run: |
          python -m pip install -r ../requirements/classical.txt
          python -m pip install --no-deps -e ..
      - name: Data (pinned commit, SHA-256 and content fingerprint are checked)
        run: python scripts/download_data.py
      - name: Tests (incl. UTF-8 CLI in pipe and file, cp1251 locale emulated)
        run: python -m pytest -q
      - name: Train and predict through a pipe
        shell: bash
        run: |
          python train.py
          python predict.py --text "Спасибо, полезно 😀" | tee predictions.csv
          python -c "import pathlib; t = pathlib.Path('predictions.csv').read_text(encoding='utf-8'); assert '😀' in t"
      - name: Normalization "all" as a separate artifact, user-given paths
        shell: bash
        run: |
          python train.py --normalization all --output "$RUNNER_TEMP/m/all.joblib" --reports-dir "$RUNNER_TEMP/r/all"
          python predict.py --model "$RUNNER_TEMP/m/all.joblib" --text "ты тупoй идиoт" --output "$RUNNER_TEMP/all_pred.csv"
          python scripts/external_eval.py --model "$RUNNER_TEMP/m/all.joblib" --reports-dir "$RUNNER_TEMP/r/all" > /dev/null
          test -s "$RUNNER_TEMP/r/all/external_okru.json"
      - name: Retraining reproduces committed reports byte for byte
        shell: bash
        run: |
          python train.py --normalization all
          git diff --exit-code -- reports/final_metrics.json reports/test_predictions.csv reports/normalization_all/final_metrics.json reports/normalization_all/test_predictions.csv
