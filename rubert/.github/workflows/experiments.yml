# Тяжёлые эксперименты: только вручную и на машине с GPU (self-hosted).
# Каждое задание — новый запуск в своём каталоге: готовые отчёты из репозитория не подхватываются,
# а check_experiment_run.py --trained-in-last-session подтверждает, что все прогоны обучены в этом задании.
name: experiments

on:
  workflow_dispatch:
    inputs:
      only:
        description: "кандидаты из configs/protocol.json через пробел (пусто — все)"
        required: false

jobs:
  experiments:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      RUN_DIR: experiments/runs/gh-${{ github.run_id }}-${{ github.run_attempt }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt peft==0.17.1 && python -m pip install --no-deps -e .
      - run: python scripts/download_data.py && python scripts/download_model.py --all
      - run: python scripts/experiments.py --out "$RUN_DIR" ${ONLY:+--only $ONLY}
      - run: python scripts/check_experiment_run.py "$RUN_DIR" --trained-in-last-session
      - run: python scripts/summarize_experiments.py --run-dir "$RUN_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_DIR }}
