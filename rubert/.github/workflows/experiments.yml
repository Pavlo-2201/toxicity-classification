# Тяжёлые эксперименты: только вручную и на машине с GPU (self-hosted).
name: experiments

on:
  workflow_dispatch:
    inputs:
      only:
        description: "кандидаты из configs/protocol.json через пробел (пусто — все)"
        required: false

jobs:
  experiments:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt peft==0.17.1 && python -m pip install --no-deps -e .
      - run: python scripts/download_data.py && python scripts/download_model.py
      - run: python scripts/experiments.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - run: python scripts/summarize_experiments.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiments
          path: experiments/runs
